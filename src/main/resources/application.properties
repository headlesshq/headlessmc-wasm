quarkus.banner.enabled=false
quarkus.log.level=WARNING
quarkus.log.category."java.lang.ProcessBuilder".level=INFO

# The browser has no terminal for jline, output goes to System.out which is redirected to the page.
hmc.jline.enabled=false
# Files live in the in-memory file system of the Web Image.
hmc.files.location=/HeadlessMC
# The in-memory file system is gone when the page is closed, a log file is of no use.
hmc.log.file=false
