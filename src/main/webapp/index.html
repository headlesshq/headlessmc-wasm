<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeadlessMc Web</title>
    <meta name="description" content="HeadlessMc compiled to WebAssembly with GraalVM, running in your browser.">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
    <img class="logo" src="logo.svg" alt="" width="28" height="28">
    <div class="title">
        <h1>HeadlessMc</h1>
        <span class="subtitle">WebAssembly</span>
    </div>
    <span id="status" class="status" data-state="loading">Loading</span>
    <a class="source" href="https://github.com/headlesshq/headlessmc" title="Go to repository" target="_blank" rel="noopener">
        <div class="source-icon">
            <!-- Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2025 Fonticons, Inc. -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true"><path d="M439.6 236.1 244 40.5c-5.4-5.5-12.8-8.5-20.4-8.5s-15 3-20.4 8.4L162.5 81l51.5 51.5c27.1-9.1 52.7 16.8 43.4 43.7l49.7 49.7c34.2-11.8 61.2 31 35.5 56.7-26.5 26.5-70.2-2.9-56-37.3L240.3 199v121.9c25.3 12.5 22.3 41.8 9.1 55-6.4 6.4-15.2 10.1-24.3 10.1s-17.8-3.6-24.3-10.1c-17.6-17.6-11.1-46.9 11.2-56v-123c-20.8-8.5-24.6-30.7-18.6-45L142.6 101 8.5 235.1C3 240.6 0 247.9 0 255.5s3 15 8.5 20.4l195.6 195.7c5.4 5.4 12.7 8.4 20.4 8.4s15-3 20.4-8.4l194.7-194.7c5.4-5.4 8.4-12.8 8.4-20.4s-3-15-8.4-20.4"/></svg>
        </div>
        <div class="source-repository">
            headlesshq/headlessmc
            <ul id="source-facts" class="source-facts"></ul>
        </div>
    </a>
</header>

<main id="terminal" class="terminal" aria-label="HeadlessMc terminal">
    <div id="output" class="output" role="log" aria-live="polite"></div>
    <div id="loader" class="loader">
        <div class="loader-text" id="loader-text">Downloading HeadlessMc&hellip;</div>
        <div class="loader-track"><div id="loader-bar" class="loader-bar"></div></div>
    </div>
    <form id="prompt" class="prompt" hidden autocomplete="off">
        <label for="input" class="prompt-sign">&gt;</label>
        <input id="input" class="input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off"
               enterkeyhint="send" aria-label="Command">
    </form>
</main>

<script src="repository.js"></script>
<script src="terminal.js"></script>
<script src="headlessmc.js"></script>
</body>
</html>
